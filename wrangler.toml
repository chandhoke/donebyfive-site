name = "donebyfive-site"
main = "src/index.js"
compatibility_date = "2026-06-09"

# Static site lives in ./public and is served via the ASSETS binding.
# Requests that don't match a static file (e.g. POST /api/subscribe) fall
# through to the Worker in src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"
# Serve clean URLs explicitly: /foo → /foo.html, /dir/ → /dir/index.html.
html_handling = "auto-trailing-slash"
# Run the Worker before serving assets so the www→apex redirect applies to
# every path (not just non-asset routes).
run_worker_first = true
# Serve a custom, on-brand 404 page for unknown routes.
not_found_handling = "404-page"

# D1 database that stores newsletter signups.
# Create it once with:  npx wrangler d1 create donebyfive-subscribers
# then paste the returned database_id below (replacing the placeholder).
[[d1_databases]]
binding = "DB"
database_name = "donebyfive-subscribers"
database_id = "79eaa17d-0818-418a-83c0-a2d4adf048ad"
