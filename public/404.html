<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — DoneByFive</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#111110;--stone:#F7F6F2;--stone-5:#9E9B94;--moss:#2D4A35;--moss-mid:#3D6347;--moss-lite:#5A8A68;--f-serif:'Instrument Serif',Georgia,serif;--f-sans:'Geist',system-ui,sans-serif;--f-mono:'Geist Mono','Courier New',monospace;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:#fff;font-family:var(--f-sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;-webkit-font-smoothing:antialiased;}
  .disc{width:48px;height:48px;border-radius:50%;background:var(--moss);display:flex;align-items:center;justify-content:center;font-family:var(--f-serif);font-style:italic;font-size:26px;color:var(--stone);margin-bottom:28px;}
  .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--moss-lite);margin-bottom:14px;}
  h1{font-family:var(--f-serif);font-size:52px;font-weight:400;line-height:1.05;margin-bottom:14px;}
  p{color:rgba(255,255,255,0.55);font-weight:300;max-width:440px;line-height:1.65;margin-bottom:32px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  a.btn{background:var(--moss);color:#fff;font-weight:500;font-size:14px;padding:12px 22px;border-radius:6px;text-decoration:none;transition:background .15s;}
  a.btn:hover{background:var(--moss-mid);}
  a.ghost{color:rgba(255,255,255,0.6);font-size:14px;padding:12px 18px;text-decoration:none;border:1px solid rgba(255,255,255,0.18);border-radius:6px;transition:color .15s,border-color .15s;}
  a.ghost:hover{color:#fff;border-color:rgba(255,255,255,0.4);}
</style>
</head>
<body>
  <div class="disc">5</div>
  <div class="code">Error 404</div>
  <h1>This page took the day off.</h1>
  <p>We couldn't find what you were looking for. It may have moved, or the link might be off. Let's get you back to something useful.</p>
  <div class="actions">
    <a class="btn" href="/templates/">Browse templates →</a>
    <a class="ghost" href="/">Back to home</a>
  </div>
</body>
</html>
